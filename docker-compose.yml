# ==================== docker-compose.yml ====================
#
# 默认（不加 profile）只启动 **Milvus 及其依赖**（etcd + MinIO）——
# 这是本项目日常开发/答辩的用法：MySQL / Redis / RabbitMQ 在虚拟机
# 192.168.199.128 上，Java 与 Python 在 IDE 里跑，方便打断点调试。
#
# 另外提供两组可选 profile，供「协作者 clone 后没有那台虚拟机」的场景：
#   docker compose --profile local-mw up -d     # 本地 MySQL/Redis/RabbitMQ
#   docker compose --profile apps    up -d      # 把 Java/Python 也容器化
# 两者可叠加：docker compose --profile local-mw --profile apps up -d
# 用 profile 而不是直接加服务，是为了**不改动**上面那套默认工作流。
#
# 启动：docker compose up -d
# 查看：docker compose ps
# 日志：docker compose logs -f milvus
# 停止：docker compose down          （保留数据卷）
# 清库：docker compose down -v       （连同向量/数据库数据一起删）
#
# ---------------------------------------------------------------
# ⚠️ 本机实测：hub.docker.com / registry-1.docker.io 不可达（超时），
#    因此 milvus 与 minio 这两个 Docker Hub 镜像**必须先配镜像加速器**才能拉取。
#    etcd 用的是 quay.io，实测可达，无需加速。
#
#    配置方式（Docker Desktop）：
#      Settings → Docker Engine，在 JSON 里加 registry-mirrors，例如：
#        {
#          "registry-mirrors": ["https://docker.m.daocloud.io"]
#        }
#      然后 Apply & Restart。
#
#    或者不改全局配置，只在 .env 里覆盖镜像地址（本文件已支持变量覆盖）：
#        MILVUS_IMAGE=docker.m.daocloud.io/milvusdb/milvus:v2.6.0
#        MINIO_IMAGE=docker.m.daocloud.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
# ---------------------------------------------------------------

services:
  # ---------- Milvus 依赖 1：etcd（存元数据）----------
  etcd:
    # quay.io 实测可达，不需要镜像加速
    image: quay.io/coreos/etcd:v3.5.5
    container_name: fitness-etcd
    networks: [fitness-net]
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------- Milvus 依赖 2：MinIO（存向量数据，S3 兼容）----------
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2023-03-20T20-16-18Z}
    container_name: fitness-minio
    networks: [fitness-net]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      # 注意：RELEASE.2023-03-20 这个镜像里**没有 curl**，只有 mc/mcli，
      # 用 curl 作为健康检查会永远 unhealthy（规范示例里的写法有这个问题）。
      # 这里改用 MinIO 自带的 mc 做存活探测。
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------- Milvus 单机版 ----------
  milvus:
    # ⚠️ 版本选择说明：
    #   规范示例给的是 v2.3.4（2023 年），但本项目环境装的是 pymilvus 2.6.x，
    #   客户端用 MilvusClient 门面（2.4+ 才有），跨 3 个小版本容易协议不兼容。
    #   因此这里选与客户端同代的 2.6.x。**要求服务端 ≥ 2.4**，不要退回 2.3.x。
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.6.0}
    container_name: fitness-milvus
    networks: [fitness-net]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"   # gRPC / SDK 端口（pymilvus 连这个）
      - "9091:9091"     # 健康检查与指标端口
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: milvus run standalone

  # ================================================================
  # 可选：本地中间件（profile=local-mw）
  # 供没有那台虚拟机的人使用；启用后把 Java 侧 .env 的
  # MYSQL_HOST / REDIS_HOST / RABBITMQ_HOST 改成 localhost（或容器名）即可。
  # ================================================================

  mysql:
    profiles: ["local-mw"]
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: fitness-mysql
    networks: [fitness-net]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fitness_db}
      TZ: Asia/Shanghai
    # 字符集/排序规则/时区必须显式指定：MySQL 8 默认时区是 UTC，
    # 不设 default-time-zone 会让 DATETIME 与 application.yml 的 Asia/Shanghai 差 8 小时。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化数据卷时自动执行建表脚本，等价于 README 里的手工 `mysql < sql/init.sql`
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    profiles: ["local-mw"]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: fitness-redis
    networks: [fitness-net]
    # 必须开 requirepass：Java 侧 RedisCacheService / 分布式锁 / Token 黑名单
    # 都按「有密码」配置（application.yml 的 password 占位符），空密码连不上会直接 NOAUTH。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    profiles: ["local-mw"]
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management}
    container_name: fitness-rabbitmq
    networks: [fitness-net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-agent1}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
      # vhost 是独立于账号的一层命名空间：Java 与 Python 两侧默认都是 /agent1
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/agent1}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理后台（死信队列排查用）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ================================================================
  # 可选：把 Java / Python 也容器化（profile=apps）
  # 需要先各自构建：`mvn -DskipTests package`（Java）、无需预处理（Python 在镜像内装依赖）
  # ================================================================

  python-agent:
    profiles: ["apps"]
    build:
      context: ./python-agent
    container_name: fitness-python
    networks: [fitness-net]
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      # 容器内用服务名互相寻址（不是 localhost）
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # 回调 Java 走容器网络的服务名
      JAVA_CALLBACK_URL: http://java-bff:8080
      # 密钥全部由宿主机环境注入，镜像里不留任何真实值
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      HMAC_SECRET: ${HMAC_SECRET:-change-me-hmac-shared-secret}
      # 中间件：默认仍指向虚拟机；用 local-mw 时改成本地服务名
      REDIS_HOST: ${REDIS_HOST:-192.168.199.128}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-192.168.199.128}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USERNAME:-agent1}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/agent1}
    ports:
      - "8000:8000"

  java-bff:
    profiles: ["apps"]
    build:
      context: .
    container_name: fitness-java
    networks: [fitness-net]
    depends_on:
      python-agent:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: ${MYSQL_HOST:-192.168.199.128}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fitness_db}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      REDIS_HOST: ${REDIS_HOST:-192.168.199.128}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-192.168.199.128}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-agent1}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/agent1}
      # Java 调 Python：容器内用服务名
      AI_PYTHON_URL: http://python-agent:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-bytes-or-longer}
      HMAC_SECRET: ${HMAC_SECRET:-change-me-hmac-shared-secret}
    ports:
      - "8080:8080"

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  # 本地中间件的数据卷（不启用 local-mw 时不会创建）
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  fitness-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
